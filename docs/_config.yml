title: EDAPGui — Elite Dangerous Autopilot
description: A Computer Vision based autopilot for Elite Dangerous. Automates FSD jumping, supercruise, trading and more — no game modifications required.
baseurl: "/EDAPGui"
url: "https://ap0ught.github.io"

theme: just-the-docs

color_scheme: dark

# Sort nav items by the `nav_order` front-matter field
nav_sort: order

# Favicon
favicon_ico: "/assets/images/edap.ico"

# Aux links shown in the top-right corner
aux_links:
  "GitHub":
    - "https://github.com/ap0ught/EDAPGui"
  "Discord":
    - "https://discord.gg/HCgkfSc"
aux_links_new_tab: true

# Footer
footer_content: "EDAPGui — provided for educational and personal use. Not affiliated with Frontier Developments."

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Heading anchor links
heading_anchors: true

# Back to top button
back_to_top: true
back_to_top_text: "Back to top"

# Callout configuration
callouts_level: loud
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red
  tip:
    title: Tip
    color: green

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - assets/images
